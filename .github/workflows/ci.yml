name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests and drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The test suites and the drift guard are plain Node using only builtins — no npm
      # dependencies at all. There is deliberately no install step, so a registry hiccup
      # can never turn this red.
      - name: Tests
        run: npm test

      # EatMinot is this site's twin: near-identical code, sold as one offer at one
      # price. Coordinated changes are made on identically-named branches in both repos,
      # so prefer that branch in the twin and fall back to main. Without this, a PR that
      # correctly changes a shared invariant in both repos would fail here until one of
      # the two merged.
      - name: Check out the twin (EatMinot)
        run: |
          set -euo pipefail
          BRANCH="${{ github.head_ref || github.ref_name }}"
          REPO="https://github.com/hipaasynth-svg/EatMinot.com.git"
          if git ls-remote --exit-code --heads "$REPO" "$BRANCH" >/dev/null 2>&1; then
            REF="$BRANCH"
          else
            REF="main"
          fi
          echo "Comparing against EatMinot.com@$REF"
          git clone --quiet --depth 1 --branch "$REF" "$REPO" twin

      - name: Drift guard
        run: node scripts/drift-guard.js twin
